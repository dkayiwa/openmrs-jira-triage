name: triage

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, live]
        default: dry-run
        description: live applies labels/comments; dry-run only produces artifacts
      limit:
        default: "0"
        description: max tickets this run (0 = all in scope)
  # Enable after the dry-run gate is passed (>= 90% grader agreement on evals).
  # Every 4 hours comfortably meets the pilot's 24h SLA despite cron drift.
  # NOTE: scheduled runs are LIVE (see the run step) - that is the pilot.
  # schedule:
  #   - cron: "17 */4 * * *"

permissions:
  contents: read

# Never let two sweeps overlap: both could fetch a ticket before either
# labels it, and the loser would post a duplicate comment.
concurrency:
  group: triage-pilot
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    # Bounded because the concurrency group above never cancels a running sweep,
    # which is right - a live sweep must not be killed mid-write - but means a
    # wedged run holds the group. GitHub keeps at most one pending run per group
    # and cancels the rest, so on the default 6h timeout a single hung sweep
    # silently swallows the next 4-hourly runs and the 24h SLA - a pre-registered
    # metric - is missed with nothing anywhere reporting it.
    #
    # 30 minutes was an estimate when it was written and is now measured. A
    # full re-classification of the 31-ticket cohort takes ~6.5 min: 4.6
    # classifying (8.8s per ticket, sampled over real contexts), 1.3 throttled
    # against GitHub search, 0.6 reading Jira. Steady-state sweeps are far
    # shorter, since an unchanged ticket is skipped before either call.
    #
    # The GitHub term doubled when the content backstop landed: a ticket whose
    # key search comes back empty is searched again by phrase, and in a full
    # sweep almost every key search is empty. Measured over the 29-ticket
    # cohort on 2026-08-02, phrase derivation yields a mean of exactly 1.00
    # extra search per ticket (25 tickets give one phrase, 2 give two, 2 give
    # none), so 2 searches per ticket and 5.0s rather than 2.5s.
    #
    # The number that matters if scope ever widens: this kills the job at
    # roughly 120 tickets, down from 143 before that change, and at ~90 in the
    # worst case where every summary yields the full three phrases. A cohort
    # past that cannot finish a prompt-bump sweep, and would be killed and
    # restarted every four hours forever - making progress each time, because
    # completed tickets are skipped, but never producing a grading sheet or a
    # comment report, since both are written only after the loop. If the cohort
    # approaches it, lowering MAX_PHRASES in triage/github.py buys headroom
    # back at a measured cost in what the backstop catches; 0 restores the old
    # 143 exactly, by turning the content search off while leaving the key
    # search - the one whose answer is proof - untouched.
    #
    # Every number above assumes an authenticated search: 30/min, so 2.5s per
    # search. This job is authenticated (github.token is passed to both the
    # gate and the sweep), so it holds here. A LOCAL run without GITHUB_TOKEN
    # gets 10/min, 7.5s per search, 15s of throttle per ticket, and a ceiling
    # of ~72 rather than ~120 - which the README states, because it is the one
    # supported configuration where the documented figure does not apply.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      # Runs the gate with the credentials the sweep will actually use, on the
      # runner the sweep will actually use. Until now the go-live gate was only
      # ever run locally, against a personal GITHUB_TOKEN - so the open-PR
      # backstop had never been exercised with `github.token`, which is a
      # repo-scoped ephemeral token searching a DIFFERENT org. If it cannot, the
      # backstop raises, that fails the ticket by design, and five in a row trip
      # the breaker: the first live sweep would abort having done nothing, and
      # the gate that passed locally would not have predicted it. Failing here
      # costs one runner-minute instead.
      - run: python -m triage.preflight
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TRIAGE_BOT_ACCOUNT_ID: ${{ secrets.TRIAGE_BOT_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          # Passed although preflight only reports on it: the gate's last line
          # states whether a credential is present, and omitting it here would
          # print "no env key" on a run whose sweep has one. A gate describing
          # an environment that is not the sweep's is the fault this whole step
          # exists to remove.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Scheduled runs are live by definition; manual dispatches choose.
      # LIMIT goes through env, not ${{ }} interpolation into the shell line:
      # a dispatch input is arbitrary text and would otherwise be executed.
      - run: python -m triage.run --limit "$LIMIT" ${{ (github.event_name == 'schedule' || inputs.mode == 'live') && '--live' || '' }}
        env:
          LIMIT: ${{ inputs.limit || '0' }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TRIAGE_BOT_ACCOUNT_ID: ${{ secrets.TRIAGE_BOT_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The automatic job token, not a new repo secret: the open-PR backstop
          # only reads public search results, and this raises its rate limit
          # from 10 to 30 searches/min. `permissions: contents: read` is enough.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-out
          path: out/
