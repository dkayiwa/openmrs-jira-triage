name: triage

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, live]
        default: dry-run
        description: live applies labels/comments; dry-run only produces artifacts
      limit:
        default: "0"
        description: max tickets this run (0 = all in scope)
  # Enable after the dry-run gate is passed (>= 90% grader agreement on evals).
  # Every 4 hours comfortably meets the pilot's 24h SLA despite cron drift.
  # NOTE: scheduled runs are LIVE (see the run step) - that is the pilot.
  # schedule:
  #   - cron: "17 */4 * * *"

permissions:
  contents: read

# Never let two sweeps overlap: both could fetch a ticket before either
# labels it, and the loser would post a duplicate comment.
concurrency:
  group: triage-pilot
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    # Bounded because the concurrency group above never cancels a running sweep,
    # which is right - a live sweep must not be killed mid-write - but means a
    # wedged run holds the group. GitHub keeps at most one pending run per group
    # and cancels the rest, so on the default 6h timeout a single hung sweep
    # silently swallows the next 4-hourly runs and the 24h SLA - a pre-registered
    # metric - is missed with nothing anywhere reporting it. A full 31-ticket
    # sweep takes about seven minutes, so this only ever fires on a genuine hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      # Runs the gate with the credentials the sweep will actually use, on the
      # runner the sweep will actually use. Until now the go-live gate was only
      # ever run locally, against a personal GITHUB_TOKEN - so the open-PR
      # backstop had never been exercised with `github.token`, which is a
      # repo-scoped ephemeral token searching a DIFFERENT org. If it cannot, the
      # backstop raises, that fails the ticket by design, and five in a row trip
      # the breaker: the first live sweep would abort having done nothing, and
      # the gate that passed locally would not have predicted it. Failing here
      # costs one runner-minute instead.
      - run: python -m triage.preflight
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TRIAGE_BOT_ACCOUNT_ID: ${{ secrets.TRIAGE_BOT_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          # Passed although preflight only reports on it: the gate's last line
          # states whether a credential is present, and omitting it here would
          # print "no env key" on a run whose sweep has one. A gate describing
          # an environment that is not the sweep's is the fault this whole step
          # exists to remove.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Scheduled runs are live by definition; manual dispatches choose.
      # LIMIT goes through env, not ${{ }} interpolation into the shell line:
      # a dispatch input is arbitrary text and would otherwise be executed.
      - run: python -m triage.run --limit "$LIMIT" ${{ (github.event_name == 'schedule' || inputs.mode == 'live') && '--live' || '' }}
        env:
          LIMIT: ${{ inputs.limit || '0' }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TRIAGE_BOT_ACCOUNT_ID: ${{ secrets.TRIAGE_BOT_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The automatic job token, not a new repo secret: the open-PR backstop
          # only reads public search results, and this raises its rate limit
          # from 10 to 30 searches/min. `permissions: contents: read` is enough.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-out
          path: out/
