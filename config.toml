# O3 AI triage pilot configuration.
# Everything that shapes pilot results is pre-registered here and committed
# before launch, per the design doc's "decision rule determined before results
# analyzed".

[jira]
base_url = "https://openmrs.atlassian.net"
project = "O3"
# Pinned cohort start: set to (launch date - 90d) ONCE at launch. A rolling
# "-90d" would let tickets silently age out mid-pilot and skew denominators.
cohort_created_since = "2026-04-29"
# The development[pullrequests] clause only sees dev-panel links indexed by the
# GitHub-for-Jira app, not PR URLs pasted in comments. Verified via preflight.
scope_jql = 'project = O3 AND issuetype != Epic AND status = "To Do" AND created >= "{since}" AND development[pullrequests].all = 0 ORDER BY created ASC'
# Must match the status named in scope_jql (the tests assert this). Re-checked
# per ticket in --live: a ticket transitioned out of scope between the sweep and
# the fetch must not be labelled, because the maintainer's removal of that
# label is a permanent opt-out and counts against the removal-rate metric.
scope_status = "To Do"
# Broken out because both run.py and preflight.py retry the sweep without it
# when Jira rejects the dev-panel clause, and they match it by substring - an
# edit to the spacing inside scope_jql alone would silently disable both
# fallbacks. The tests assert this is a substring of scope_jql.
dev_panel_clause = " AND development[pullrequests].all = 0"
# The metrics cohort is deliberately WIDER than scope_jql: it must still find
# tickets the bot labelled that have since left "To Do" or gained a linked PR,
# or the removal-rate denominator would shrink as the pilot progressed. Pinned
# here rather than built in Python because it is the denominator of all three
# pre-registered metrics.
cohort_jql = 'project = O3 AND issuetype != Epic AND created >= "{since}"'
# Auto-discovered when empty; pin to e.g. "customfield_10816" to skip discovery.
acceptance_criteria_field = ""

[github]
# The dev-panel backstop (see triage/github.py). scope_jql already excludes
# tickets whose Jira dev panel lists a PR, but that panel only sees what the
# GitHub-for-Jira app indexed: on the launch cohort O3-5816 reached the sweep
# while openmrs-esm-core#1818 ("(fix) O3-5816: ...") was open. Labelling a
# ticket that is already in review invites the removal that the pilot counts as
# a permanent opt-out, so the sweep asks GitHub directly for an open PR naming
# the key. Set check_open_prs = false to sweep on Jira's word alone.
org = "openmrs"
check_open_prs = true

[labels]
# NOTE: names differ from the design doc's ai-triage/* form because Jira Cloud
# rejects '/' in labels (preflight has a charset test). One label per ticket.
automation_candidate = "ai-triage-automation-candidate"
needs_judgment = "ai-triage-needs-judgment"
needs_more_info = "ai-triage-needs-more-info"

[bots]
# Comment authors the classifier must never see, in addition to every
# accountType == "app" author (GitHub bot etc.) and the triage bot itself.
blocked_account_ids = []

[claude]
model = "claude-opus-5"
max_tokens = 16000

[prompt]
# Bump whenever prompt/system.md changes; stamped into comments + journal so
# label removals can be correlated with prompt versions.
version = "v1"

[metrics]
# Pre-registered success thresholds from the design doc. Do not tune after launch.
# pilot_launch anchors the 24h SLA: the initial backlog is older than 24h by
# definition, so the SLA runs from max(ticket created, pilot_launch).
pilot_launch = ""
sorted_within_24h_pct = 95
max_label_removal_rate = 0.10
min_intro_outcomes = 5
intro_label = "intro"
intro_rejected_label = "not-intro"
